name: Deploy Lambda

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/deploy_lambda.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run tests
        run: pytest -q

  deploy:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install Lambda dependencies (Linux target)
        run: |
          mkdir -p lambda_build
          pip install \
            -r backend/requirements.txt \
            --target lambda_build \
            --platform manylinux2014_x86_64 \
            --only-binary=:all: \
            --python-version 3.11 \
            --upgrade

      - name: Copy backend code
        run: |
          cp -r backend lambda_build/backend
          find lambda_build -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

      - name: Create deployment ZIP
        run: |
          cd lambda_build
          zip -r ../sportsbank_lambda.zip . -x "*.pyc"
          cd ..
          echo "ZIP size: $(du -h sportsbank_lambda.zip | cut -f1)"

      - name: Upload to S3 and update Lambda
        run: |
          aws s3 cp sportsbank_lambda.zip s3://meu-bucket-sportsbank/deploy/sportsbank_lambda.zip
          aws lambda update-function-code \
            --function-name sportsbank-pro-backend \
            --s3-bucket meu-bucket-sportsbank \
            --s3-key deploy/sportsbank_lambda.zip
          echo "Lambda deploy completed successfully!"
