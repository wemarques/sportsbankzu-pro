name: Deploy Lambda

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/deploy_lambda.py"
      - ".github/workflows/deploy-lambda.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install -r backend/requirements-ml.txt
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run tests
        run: pytest -q

  deploy:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install Lambda dependencies (Linux target)
        run: |
          mkdir -p lambda_build
          pip install \
            -r backend/requirements.txt \
            --target lambda_build \
            --platform manylinux2014_x86_64 \
            --only-binary=:all: \
            --python-version 3.11 \
            --upgrade
          # XGBoost only (no sklearn/scipy) — uses native JSON format for inference
          pip install \
            "xgboost>=2.0.0" \
            --target lambda_build \
            --platform manylinux2014_x86_64 \
            --only-binary=:all: \
            --python-version 3.11 \
            --upgrade

      - name: Strip unnecessary files from dependencies
        run: |
          echo "Size before cleanup: $(du -sh lambda_build | cut -f1)"
          # Remove tests, docs, examples, type stubs
          find lambda_build -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find lambda_build -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find lambda_build -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find lambda_build -type d -name "*.dist-info" -exec rm -rf {} + 2>/dev/null || true
          find lambda_build -name "*.pyi" -delete 2>/dev/null || true
          find lambda_build -name "*.pyx" -delete 2>/dev/null || true
          find lambda_build -name "*.c" -delete 2>/dev/null || true
          find lambda_build -name "*.h" -delete 2>/dev/null || true
          # sklearn: remove bundled datasets, images, and test data
          rm -rf lambda_build/sklearn/datasets/data 2>/dev/null || true
          rm -rf lambda_build/sklearn/datasets/descr 2>/dev/null || true
          rm -rf lambda_build/sklearn/datasets/images 2>/dev/null || true
          # scipy: remove test data and Fortran sources
          find lambda_build/scipy -type d -name "_unuran" -exec rm -rf {} + 2>/dev/null || true
          # xgboost: remove demo/examples
          rm -rf lambda_build/xgboost/demo 2>/dev/null || true
          echo "Size after cleanup: $(du -sh lambda_build | cut -f1)"

      - name: Copy backend code
        run: |
          # Remove any pre-existing backend/ dir from pip to avoid nesting
          rm -rf lambda_build/backend
          cp -r backend lambda_build/backend
          find lambda_build -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          # Verify: backend/main.py should be the CURRENT version
          echo "backend/main.py lines: $(wc -l < lambda_build/backend/main.py)"
          echo "Nested backend check: $(ls lambda_build/backend/backend/main.py 2>/dev/null && echo 'NESTED EXISTS - ERROR' || echo 'OK - no nesting')"

      - name: Create deployment ZIP
        run: |
          cd lambda_build
          zip -r ../sportsbank_lambda.zip . -x "*.pyc"
          cd ..
          echo "ZIP size: $(du -h sportsbank_lambda.zip | cut -f1)"

      - name: Upload to S3 and update Lambda
        run: |
          aws s3 cp sportsbank_lambda.zip s3://meu-bucket-sportsbank/deploy/sportsbank_lambda.zip
          aws lambda update-function-code \
            --function-name sportsbank-pro-backend \
            --s3-bucket meu-bucket-sportsbank \
            --s3-key deploy/sportsbank_lambda.zip
          echo "Lambda deploy completed successfully!"

      - name: Wait for Lambda function to be active
        run: |
          echo "Waiting for Lambda function to be fully updated..."
          aws lambda wait function-updated --function-name sportsbank-pro-backend
          echo "Lambda function is active and ready!"

      - name: Warm up FootyStats cache (sequential per league)
        run: |
          API_URL="https://4eksz2n7h5.execute-api.us-east-1.amazonaws.com"
          LEAGUES=(
            "premier-league"
            "championship"
            "england-league-one"
            "england-league-two"
            "primera-division"
            "a-league"
            "austria-bundesliga"
            "pro-league"
            "brazil-serie-a"
            "brazil-serie-b"
            "denmark-superliga"
            "france-ligue-1"
            "france-ligue-2"
            "germany-bundesliga"
            "germany-2-bundesliga"
            "italy-serie-a"
            "italy-serie-b"
            "netherlands-eredivisie"
            "portugal-liga-nos"
            "saudi-professional-league"
            "scotland-premiership"
            "spain-la-liga"
            "spain-segunda-division"
            "switzerland-super-league"
            "turkey-super-lig"
            "japan-j-league"
            "south-korea-k-league"
            "norway-eliteserien"
            "sweden-allsvenskan"
            "uae-pro-league"
            "netherlands-eerste-divisie"
            "greece-super-league"
            "usa-mls"
            "czech-first-league"
            "colombia-primera-a"
          )

          echo "Starting cache warm-up for ${#LEAGUES[@]} leagues..."
          SUCCESS=0
          FAIL=0

          for LEAGUE in "${LEAGUES[@]}"; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 25 \
              "${API_URL}/fixtures?leagues=${LEAGUE}&date=today" 2>/dev/null || echo "000")

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
              echo "  ✓ ${LEAGUE} (HTTP ${HTTP_CODE})"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "  ✗ ${LEAGUE} (HTTP ${HTTP_CODE})"
              FAIL=$((FAIL + 1))
            fi

            # 3s delay between calls to avoid FootyStats API rate limiting
            sleep 3
          done

          echo ""
          echo "Cache warm-up complete: ${SUCCESS} OK, ${FAIL} failed (out of ${#LEAGUES[@]} leagues)"

          # Don't fail the workflow if some leagues fail — cache is best-effort
          if [ "$SUCCESS" -eq 0 ]; then
            echo "::warning::All league warm-up calls failed. Cache may be cold."
          fi
